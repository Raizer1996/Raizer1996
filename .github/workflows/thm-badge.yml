name: Update THM badge
on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  badge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Render badge
        env:
          THM_BADGE_URL: ${{ secrets.THM_BADGE_URL }}
        run: |
          set -euo pipefail
          [ -n "${THM_BADGE_URL:-}" ] || { echo "THM_BADGE_URL secret missing"; exit 1; }
          mkdir -p assets
          cat > shot.js <<'EOF'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch();
            const ctx = await browser.newContext({
              deviceScaleFactor: 2,
              viewport: { width: 1200, height: 700 },
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
            });
            const page = await ctx.newPage();
            page.on("pageerror", e => console.log(`[pageerror] ${e.message}`));
            page.on("requestfailed", r => console.log(`[requestfailed] ${r.url().slice(0, 80)} ${r.failure()?.errorText}`));
            page.on("response", r => { if (r.status() >= 400) console.log(`[http ${r.status()}] ${r.url().slice(0, 80)}`); });

            // The badge URL returns a page/image, not JS: open it directly.
            const resp = await page.goto(process.env.THM_BADGE_URL, { waitUntil: "networkidle", timeout: 45000 });
            console.log("status:", resp?.status(), "content-type:", resp?.headers()["content-type"]);
            console.log("title:", await page.title());

            const findBox = () => page.evaluate(() => {
              let best = null;
              for (const el of document.querySelectorAll("body *")) {
                if (["SCRIPT", "STYLE", "NOSCRIPT"].includes(el.tagName)) continue;
                const r = el.getBoundingClientRect();
                const cs = getComputedStyle(el);
                if (cs.visibility === "hidden" || cs.display === "none") continue;
                if (r.width >= 150 && r.height >= 60 && r.width <= 1100 && (!best || r.width * r.height > best.width * best.height)) {
                  best = { x: r.x, y: r.y, width: r.width, height: r.height, tag: el.tagName };
                }
              }
              return best;
            });
            let box = null;
            for (let i = 0; i < 40 && !box; i++) {
              box = await findBox();
              if (!box) await page.waitForTimeout(500);
            }
            await page.waitForTimeout(2000);
            box = (await findBox()) || box;

            if (!box) {
              console.error("Badge did not render.");
              console.error("HTML:", (await page.content()).slice(0, 2500));
              await page.screenshot({ path: "debug.png", fullPage: true });
              process.exit(1);
            }
            console.log("Badge rendered:", JSON.stringify(box));
            await page.screenshot({ path: "debug.png", fullPage: true });
            const { tag, ...clip } = box;
            await page.screenshot({ path: "assets/thm-badge.png", clip, omitBackground: true });
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node shot.js
      - name: Upload debug screenshot on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug.png
          if-no-files-found: ignore
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thm-badge.png
          if git diff --cached --quiet; then echo "No change"; else git commit -m "chore: update THM badge" && git push; fi
